version: 2
registries:
  npm-github:
    type: npm-registry
    url: https://npm.pkg.github.com
    token: ${{ secrets.CROSS_REPO_PACKAGE_TOKEN }}
  nuget-github:
    type: nuget-feed
    url: https://nuget.pkg.github.com/AndrewMclachlan/index.json
    token: ${{ secrets.CROSS_REPO_PACKAGE_TOKEN }}

updates:
  - package-ecosystem: npm
    directory: /src/Asm.AmCom.Web
    schedule:
      interval: weekly
      timezone: "Australia/Brisbane"
      day: tuesday
      time: "08:00"
    groups:
      dev-dependencies:
        applies-to: version-updates
        patterns:
          - "*"
        dependency-type: "development"
      prod-dependencies:
        applies-to: version-updates
        patterns:
          - "*"
        dependency-type: "production"
    open-pull-requests-limit: 20
    registries: "*"

  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: weekly
      timezone: "Australia/Brisbane"
      day: tuesday
      time: "08:00"
    groups:
      version-updates:
        applies-to: version-updates
        patterns:
          - "*"
    # Transitive-only pins. They must stay on the major their dependents were compiled against: transitive
    # pinning makes the pin win, so a major bump forces the new assembly onto those packages at runtime.
    ignore:
      - dependency-name: "Microsoft.OpenApi"
        update-types: ["version-update:semver-major"]
      - dependency-name: "SQLitePCLRaw.*"
        update-types: ["version-update:semver-major"]
    open-pull-requests-limit: 20
    registries: "*"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      timezone: "Australia/Brisbane"
      day: tuesday
      time: "08:00"
